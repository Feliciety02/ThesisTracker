document.addEventListener('click', e => {
  const el = e.target.closest('[data-view],[data-action]');
  if (!el) return;
  if (el.dataset.view) { S.view = el.dataset.view; S.addTaskOpen = S.addExpOpen = false; render(); window.scrollTo(0, 0); return; }
  const a = el.dataset.action, v = el.dataset.v;
  if (a === 'install') { doInstall(); return; }
  if (a === 'logout') { logout(); return; }
  if (a === 'pwToggle') {
    const inp = el.parentNode.querySelector('input');
    S.auth.showPw = inp.type === 'password';
    inp.type = S.auth.showPw ? 'text' : 'password';
    el.innerHTML = S.auth.showPw ? EYE_OFF : EYE;
    const lbl = S.auth.showPw ? 'Hide password' : 'Show password';
    el.setAttribute('aria-pressed', S.auth.showPw); el.setAttribute('aria-label', lbl); el.title = lbl;
    inp.focus(); const L = inp.value.length; try { inp.setSelectionRange(L, L); } catch (err) {}
    return;
  }
  if (a === 'clearSearch') { S.q = ''; const q = document.getElementById('q'); if (q) { q.value = ''; q.focus(); } el.hidden = true; renderTaskList(); return; }
  if (a === 'authBack') {
    if (S.auth.busy) return;
    if (S.auth.step === 'email') { store.del(INSTALL_SKIP); document.getElementById('login').hidden = true; document.getElementById('install').hidden = false; return; }
    S.auth = { step: 'email', email: S.auth.email }; renderAuth(''); return;
  }
  if (a === 'authForgot' || a === 'authResend') {
    if (S.auth.sending || S.auth.busy) return;
    S.auth.sending = true; renderAuth('');
    call('authForgot', S.auth.email).then(() => { S.auth.sending = false; S.auth.step = 'code'; renderAuth(''); toast('Code sent', 1800); })
      .catch(e => { S.auth.sending = false; renderAuth(e.network && !e.server ? 'No signal.' : e.message); });
    return;
  }
  if (a === 'installNow') { doInstall(); return; }
  if (a === 'installSkip') { S.cameFromInstall = true; store.set(INSTALL_SKIP, '1'); document.getElementById('install').hidden = true; startApp(); return; }
  if (a === 'gotoView') { S.view = v; S.member = 'All'; S.status = 'Open'; render(); window.scrollTo(0, 0); return; }
  if (a === 'goto') { S.view = 'tasks'; S.member = v; S.status = 'Open'; render(); window.scrollTo(0, 0); }
  else if (a === 'member') { S.member = v; render(); }
  else if (a === 'status') { S.status = v; render(); }
  else if (a === 'revOwner') { S.revOwner = v; render(); }
  else if (a === 'revStatus') { S.revStatus = v; render(); }
  else if (a === 'toggleAddTask') { S.addTaskOpen = !S.addTaskOpen; render(); if (S.addTaskOpen) { const i = document.querySelector('#addForm [name=task]'); if (i) i.focus(); } }
  else if (a === 'toggleAddExp') { S.addExpOpen = !S.addExpOpen; render(); if (S.addExpOpen) { const i = document.querySelector('#addSupply [name=item]'); if (i) i.focus(); } }
  else if (a === 'sampleFilter') { S.sampleFilter = v; render(); }
  else if (a === 'delSample') {
    const id = el.dataset.id, x = sampleById(id);
    if (!x) return;
    if (Object.keys(S.uploading).concat(Object.keys(S.waiting), Object.keys(S.preparing)).some(k => k.indexOf(id + '_') === 0)) { toast('Wait a moment: ' + id + '\'s photos are still saving.', 3000, true); return; }
    const n = takenSet(x).size;
    if (!confirm('Delete ' + id + (n ? ' and its ' + n + ' photo' + (n > 1 ? 's' : '') : '') + '?\n\nPhotos go to the Drive trash. The label ' + id + ' will be used again for your next new sample.')) return;
    Object.keys(S.queued).filter(k => k.indexOf(id + '_') === 0).forEach(k => { delete S.queued[k]; PhotoQ.del(k); });   // waiting photos must not bring it back
    Object.keys(S.thumbs).concat(Object.keys(S.issues)).filter(k => k.indexOf(id + '_') === 0).forEach(k => { delete S.thumbs[k]; delete S.issues[k]; });
    try { const c = JSON.parse(store.get(CAM_STORE) || 'null'); if (c && c.id === id) store.del(CAM_STORE); } catch (err) {}
    delete S.open['smp_' + id];
    save('deleteSample', [id], () => { S.data.samples = S.data.samples.filter(s => s.id !== id); })
      .then(() => toast('Deleted ' + id + ' · label free to reuse', 2200));
    updateSyncChip();
  }
  else if (a === 'phoneCopy') {
    const on = !phoneCopyOn(); store.set(PHONE_COPY, on ? '1' : '0'); render();
    toast(on ? 'Each photo is also saved on this phone (Gallery → Download), named like FA-001_01.jpg' : 'Photos are saved to Drive only', 3500);
  }
  else if (a === 'toggleCard') { S.open[v] = !S.open[v]; render(); }
  else if (a === 'more') { S.more = v; S.addRec = null; render(); window.scrollTo(0, 0); }
  else if (a === 'addRec') { S.addRec = S.addRec === v ? null : v; render(); if (S.addRec) { const i = document.querySelector('form.recform input:not([type=date]),form.recform textarea'); if (i) i.focus(); } }
  else if (a === 'recDel') {
    const kind = el.dataset.kind, row = +el.dataset.row, r = recs(kind).find(x => x.row === row);
    if (!r || !confirm('Delete "' + (r.item || r.topic || [r.model, r.run].filter(Boolean).join(' · ') || 'this') + '"?')) return;
    save('deleteRecord', [kind, row], () => { S.data.records[kind] = recs(kind).filter(x => x !== r); });
  }
  else if (a === 'recSet') {
    const kind = el.dataset.kind, row = +el.dataset.row, field = el.dataset.field;
    save('updateRecord', [kind, row, field, v], () => { const r = recs(kind).find(x => x.row === row); if (r) r[field] = v; });
  }
  else if (a === 'copyCompare') {
    const t = compareTSV();
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied ✓ Paste it into the doc', 2000), () => toast('Couldn\'t copy here', 2500, true));
  }
  else if (a === 'prefarm') {
    const { st } = prefarmState(), kind = (PREFARM.find(x => x[0] === v) || [])[2];
    if (kind === 'auto') { toast(v === 'supplies' ? 'Mark them Paid on the Expenses page' : 'Open the app once with signal', 2200); return; }
    st.done[v] = !st.done[v]; store.set('bt:prefarm', JSON.stringify(st)); render();
  }
  else if (a === 'openSheet') {
    const sel = {}; sheetCandidates().forEach(x => { if ((x.angles || []).length >= MIN_ANGLES) sel[x.id] = true; });
    openOv({ type: 'sheet', sel, date: localDay() });
  }
  else if (a === 'sheetPrint') { window.print(); }
  else if (a === 'sheetSubmit') {
    const ids = Object.keys(S.ov.sel), date = S.ov.date || localDay();
    const late = ids.filter(id => { const x = sampleById(id); return x && x.date && date > addDays(x.date, 1); });
    if (!ids.length || !confirm('Mark ' + ids.length + ' sample(s) as submitted to DA RCPC on ' + fmt(date) + '?' +
      (late.length ? '\n\n⚠ ' + late.join(', ') + ' would be LATE (more than a day after collection) and invalid.' : ''))) return;
    save('submitSamples', [ids, date], () => { ids.forEach(id => { const x = sampleById(id); if (x) x.submitted = date; }); });
    closeOv();
  }
  else if (a === 'ovClose') { closeOv(); }
  else if (a === 'gallery') { S.gallery = v === '1'; if (S.gallery) { if (S.photoIndex && S.photoIndex.__err) S.photoIndex = null; loadPhotoIndex(); } render(); }
  else if (a === 'newSample') { newSample(); }
  else if (a === 'cam') { openCam(el.dataset.id); }
  else if (a === 'camClose') {
    const x = sampleById(S.cam.id), n = takenSet(x).size;
    if (n >= MIN_ANGLES) { S.cam.stage = 'finish'; saveCamState(); renderCam(); }   // never skip the labeling reminder
    else if (confirm('Only ' + n + ' of ' + MIN_ANGLES + ' required photos for ' + x.id + '. Close anyway?\nYou can finish later: tap 📷 on ' + x.id + '.')) closeCam();
  }
  else if (a === 'camShot') {
    const ang = +v;
    if (S.cam.stage === 'finish') { S.cam.stage = 'shoot'; S.cam.target = ang; saveCamState(); renderCam(); if (S.cam.live === false || !liveCamOK()) takeShot(ang); }
    else if (S.cam.live !== false && liveCamOK()) { S.cam.target = ang; renderCam(); }     // next shutter tap retakes this one
    else { S.cam.target = null; takeShot(ang); }
  }
  else if (a === 'snap') { snap(); }
  else if (a === 'copyPaper') {
    const t = document.getElementById('paperText').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied ✓', 1500), () => toast('Select the text and copy it', 2500));
  }
  else if (a === 'exportSet') {
    if (S.exporting) return;
    S.exporting = true; render();
    toast('Exporting… this can take a minute');
    call('exportValidatedDataset').then(r => {
      if (r && r.folder) S.data.exportFolderUrl = r.folder;
      toast('Exported ✓ ' + (r ? r.copied : 0) + ' new photos', 3000);
    }).catch(e => toast(e.network ? 'Needs signal: try again when online.' : 'Export failed: ' + e.message, 4000, true))
      .finally(() => { S.exporting = false; render(); });
  }
  else if (a === 'revSelAll') {
    const list = S.data.revisions.filter(r => (S.revOwner === 'All' || r.owner.indexOf(S.revOwner) > -1) && (S.revStatus === 'All' || r.status === S.revStatus));
    list.forEach(r => { S.revSel[r.row] = true; }); render();
  }
  else if (a === 'revSelClear') { S.revSel = {}; render(); }
  else if (a === 'revBulk') {
    const rows = Object.keys(S.revSel).map(Number), st = v, me = S.user;
    if (!rows.length) return;
    if (st === 'C' && !confirm('Mark ' + rows.length + ' item(s) as complied, done by ' + me + '?')) return;
    S.revSel = {};
    save('updateRevisions', [rows, st, st === 'C' ? me : ''], () => {
      rows.forEach(r => { const x = S.data.revisions.find(y => y.row === r); if (x) { x.status = st; x.doneBy = st === 'C' ? me : ''; } });
    });
  }
  else if (a === 'reschedule') {
    const date = (document.getElementById('reschedDate') || {}).value;
    if (!date) return toast('Pick a date first', 2000, true);
    const items = allTasks().filter(t => (S.member === 'All' || t.tab === S.member) && !t.tempId && dueState(t) === 'overdue');
    save('rescheduleTasks', [items.map(t => ({ tab: t.tab, row: t.row })), date], () => {
      items.forEach(t => { const x = member(t.tab).tasks.find(y => y.row === t.row); if (x) x.due = date; });
    }).then(() => toast('Moved ' + items.length + ' task(s) to ' + fmt(date), 2200));
  }
  else if (a === 'camFinish') { S.cam.stage = 'finish'; saveCamState(); renderCam(); }
  else if (a === 'camDone') { if (S.cam && S.cam.stage === 'finish') markPacked(S.cam.id); closeCam(); }
  else if (a === 'camNextSample') { markPacked(S.cam.id); S.cam = null; store.del(CAM_STORE); newSample(); }   // camera stays on: next leaf opens instantly
  else if (a === 'camDisease' || a === 'camSite') {
    const id = S.cam.id, field = a === 'camDisease' ? 'disease' : 'site';
    save('updateSample', [id, field, v], () => { sampleById(id)[field] = v; });
    renderCam();
  }
  else if (a === 'editTask') { const k = el.dataset.tab + '_' + el.dataset.row; S.editTask = S.editTask === k ? null : k; renderTaskList(); }
  else if (a === 'delTask') {
    const tab = el.dataset.tab, row = +el.dataset.row, t = member(tab).tasks.find(x => x.row === row);
    if (!confirm('Delete task ' + t.id + ' "' + t.task + '"?')) return;
    S.editTask = null;
    save('deleteTask', [tab, row], () => { const m = member(tab); m.tasks = m.tasks.filter(x => x.row !== row); });
  }
  else if (a === 'receipt') { takeReceipt(+el.dataset.row); }
  else if (a === 'expFilter') { S.expFilter = v; render(); }
  else if (a === 'delSupply') {
    const row = +el.dataset.row, x = S.data.supplies.find(s => s.row === row);
    if (!confirm('Delete "' + x.item + '" from expenses?')) return;
    save('deleteSupply', [row], () => { S.data.supplies = S.data.supplies.filter(s => s.row !== row); });
  }
  else if (a === 'rev') {
    const row = +el.dataset.row;
    save('updateRevision', [row, 'status', v], () => { const x = S.data.revisions.find(r => r.row === row); x.status = v; x.doneBy = v === 'C' ? (x.doneBy || S.user) : ''; });
  }
});

document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.change;
  if (!k) return;
  const row = +el.dataset.row, field = el.dataset.field;
  let val = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value;
  if (k === 'task') {
    const tab = el.dataset.tab;
    save('updateTask', [tab, row, field, val], () => {
      const t = member(tab).tasks.find(x => x.row === row);
      t[field] = val;
      if (field === 'status') { t.completed = val === 'Done' ? localDay() : ''; t.doneBy = val === 'Done' ? (t.doneBy || S.user) : ''; }
    });
  } else if (k === 'revsel') {
    if (el.checked) S.revSel[row] = true; else delete S.revSel[row];
    render();
  } else if (k === 'rev') {
    save('updateRevision', [row, field, val], () => { S.data.revisions.find(r => r.row === row)[field] = val; });
  } else if (k === 'sample') {
    const id = el.dataset.id;
    save('updateSample', [id, field, val], () => { sampleById(id)[field] = val; });
  } else if (k === 'supply') {
    save('updateSupply', [row, field, val], () => { S.data.supplies.find(s => s.row === row)[field] = val; });
  } else if (k === 'rcpc') {
    save('setRcpcDate', [val], () => { S.data.rcpcDate = val; });
  } else if (k === 'setting') {
    if (el.type === 'number' && val !== '') val = Math.max(0, Math.round(val));
    save('setSetting', [field, val], () => { S.data.settings = Object.assign({}, settings(), { [field]: val }); });
  } else if (k === 'rec') {
    const kind = el.dataset.kind;
    save('updateRecord', [kind, row, field, val], () => {
      const r = recs(kind).find(x => x.row === row);
      if (!r) return;
      r[field] = val;
      if (field === 'done') r.doneBy = val ? S.user : '';
    });
  } else if (k === 'sheetSel') {
    if (el.checked) S.ov.sel[el.dataset.id] = true; else delete S.ov.sel[el.dataset.id];
    renderOv();
  } else if (k === 'sheetDate') {
    S.ov.date = val; renderOv();
  }
});

});
// Caps Lock warning on password boxes
['keydown', 'keyup'].forEach(t => document.addEventListener(t, e => {
  if (!e.target.matches || !e.target.matches('#authForm [name=pw]') || !e.getModifierState) return;
  const h = document.getElementById('pwHint'); if (!h) return;
  if (e.getModifierState('CapsLock')) { h.textContent = '⇪ Caps Lock is on'; h.className = 'fhint warn'; }
  else if (h.textContent.indexOf('Caps') > -1) { const nw = e.target.dataset.newpw; h.textContent = nw ? pwLenHint(e.target.value) : ''; h.className = 'fhint' + (nw && e.target.value.length >= 8 ? ' ok' : ''); }
}));
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; const c = document.getElementById('qClear'); if (c) c.hidden = !S.q; renderTaskList(); }
  if (t.matches && t.matches('#authForm [name=code]')) {          // pasted "123 456" or "123-456" → 123456, then jump to the password
    const d = t.value.replace(/\D/g, '').slice(0, 6);
    if (d !== t.value) t.value = d;
    const pw = document.querySelector('#authForm [name=pw]');
    if (d.length === 6 && pw && !pw.value) pw.focus();
  }
  if (t.matches && t.matches('#authForm [data-newpw]')) {
    const h = document.getElementById('pwHint'); if (h && h.textContent.indexOf('Caps') < 0) { h.textContent = pwLenHint(t.value); h.className = 'fhint' + (t.value.length >= 8 ? ' ok' : ''); }
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'authForm') { authSubmit(f); return; }
  if (f.id === 'addForm') {
    const t = { task: f.task.value.trim(), category: f.category.value, priority: f.priority.value, due: f.due.value };
    if (!t.task) return;
    const tab = f.tab.value;
    f.querySelector('button').disabled = true;
    f.task.blur();
    save('addTask', [tab, t], null, () => {
      const tempId = 'tmp' + Date.now();
      member(tab).tasks.push({ row: 0, id: 'new', tempId, task: t.task, category: t.category, priority: t.priority,
        status: 'Not Started', due: t.due || '', link: null, notes: '', completed: '' });
      return { tempId, tab };
    }).then(task => {
      if (!task) return;
      member(tab).tasks.push(task); S.addTaskOpen = false; persist(); render();
      toast('Task added to ' + tab, 1600);
    });
  } else if (f.classList.contains('recform')) {
    const kind = f.getAttribute('data-kind'), x = {};      // not f.dataset: a field named "dataset" would shadow it
    new FormData(f).forEach((val, key) => { x[key] = typeof val === 'string' ? val.trim() : val; });
    if (kind === 'consults') { x.status = 'Open'; x.signed = false; }
    if (kind === 'defense') x.done = false;
    S.data.records = S.data.records || {}; S.data.records[kind] = recs(kind);
    save('addRecord', [kind, x], null, () => {
      const tempId = 'tmp' + Date.now();
      S.data.records[kind].push(Object.assign({ row: 0, tempId, by: S.user }, x));
      return { tempId, kind };
    }).then(res => {
      if (!res) { S.addRec = null; render(); return; }
      S.data.records[kind].push(res); S.addRec = null; persist(); render();
      toast('Added ✓', 1200);
    });
  } else if (f.id === 'addSupply') {
    const x = { item: f.item.value.trim(), purpose: '', qty: f.qty.value === '' ? '' : +f.qty.value,
      cost: f.cost.value === '' ? '' : +f.cost.value, assigned: f.assigned.value, notes: '',
      category: f.category.value, date: f.date.value, bought: f.bought.checked, receipt: '' };
    if (!x.item) return;
    f.reset(); f.item.blur();
    save('addSupply', [x], null, () => {
      const tempId = 'tmp' + Date.now();
      S.data.supplies.push(Object.assign({ row: 0, tempId }, x));
      return { tempId };
    }).then(res => {
      if (!res) return;
      S.data.supplies.push(res); S.addExpOpen = false; persist(); render();
      toast('Added ' + res.item, 1400);
    });
  }
});

/* auto-refresh so the team sees each other's updates */
const busy = () => Object.keys(S.uploading).length || Object.keys(S.waiting).length;
// Live updates: every 10 s ask the server for its tiny "last change" stamp; fetch everything only when it moved.
// Changes made by teammates in the app OR typed straight into the Google Sheet show up within seconds.
function checkLive() {
  if (DEMO || !S.data || !S.user || S.checking || !navigator.onLine || document.visibilityState !== 'visible' || busy()) return;
  S.checking = true;
  call('getVersion').then(v => {
    if (v && v !== S.data.version) return load(true);
    setOffline(false);
  }).catch(e => { if (/Unknown action/.test(e.message || '')) S.noLive = true; }).finally(() => { S.checking = false; });
}
setInterval(checkLive, 10000);
// fallback for an older server version that can't answer getVersion yet
setInterval(() => { if (S.noLive && S.data && navigator.onLine && document.visibilityState === 'visible' && !isTyping() && !busy()) load(true); }, 120000);
let lastFocusLoad = 0;
document.addEventListener('visibilitychange', () => {
  if (S.data && document.visibilityState === 'visible' && !busy() && Date.now() - lastFocusLoad > 5000) { lastFocusLoad = Date.now(); if (S.noLive) { if (!isTyping()) load(true); } else checkLive(); }
});
window.addEventListener('online', () => { if (S.data) flushOutbox().then(flushPhotos).then(() => load(true)); });
window.addEventListener('offline', () => { if (S.data) setOffline(true, (cached() || {}).at); });

/* install as an app */
let installEvt = null;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; document.getElementById('installBtn').hidden = false; });
window.addEventListener('appinstalled', () => {
  document.getElementById('installBtn').hidden = true;
  if (!document.getElementById('install').hidden) { document.getElementById('install').hidden = true; startApp(); }
  toast('Installed ✓', 2500);
});
if (isIOS && !isStandalone) document.getElementById('installBtn').hidden = false;
function doInstall() {
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.then(c => { if (c && c.outcome === 'accepted') { store.set(INSTALL_SKIP, '1'); if (!document.getElementById('install').hidden) { S.cameFromInstall = true; document.getElementById('install').hidden = true; startApp(); } } }).finally(() => { installEvt = null; }); }
  else if (isIOS) document.getElementById('iosHint').hidden = false;
  else toast('Use your browser menu → Install app', 4000);
}
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* start */
PhotoQ.all().then(jobs => { (jobs || []).forEach(j => { S.queued[jobKey(j)] = j; }); updateSyncChip(); });
setInterval(() => { if (navigator.onLine && (outbox().length || Object.keys(S.queued).length)) flushOutbox().then(flushPhotos); }, 45000);
// ask the browser to keep offline photos/changes even when storage is tight
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
updateSyncChip();
if (DEMO) document.getElementById('demo').hidden = false;
function startApp() {
  let acct = null; try { acct = JSON.parse(store.get(ACCT_STORE) || 'null'); } catch (e) {}
  const c = cached(); if (c) S.data = c.d;
  if (!store.get(TOKEN_STORE) || !acct || !TEAM.some(m => m.tab === acct.user)) { lock(); return; }
  signIn(acct.user);                 // stays signed in on this device, online or offline
  load().then(() => { resumeCam(); return flushPhotos(); });
}
if (!isStandalone && !store.get(INSTALL_SKIP)) {
  document.getElementById('install').hidden = false;      // first: offer the app
  if (isIOS) document.getElementById('iosHint').hidden = false;
} else startApp();
</script>
</body>
</html>
