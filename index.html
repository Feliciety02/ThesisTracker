<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4b3a">
<meta name="description" content="Task tracker for the Banana Leaf Disease thesis team">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thesis Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-48.png" type="image/png" sizes="48x48">
<meta property="og:title" content="Banana Thesis Tracker">
<meta property="og:description" content="Tasks, DA RCPC samples, photos and expenses for the EfficientNetB0 banana leaf disease thesis.">
<meta property="og:image" content="https://feliciety02.github.io/ThesisTracker/icons/og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<title>Banana Thesis Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6ef; --card:#ffffff; --ink:#1f3b33; --muted:#5f6f66; --line:#e2e5d6; --soft:#eef2e4;
  --brand:#1f4b3a; --brand-ink:#ffffff; --leaf:#588d10; --leaf-soft:#eaf2da; --banana:#588d10; --banana-soft:#eef4e0;
  --red:#b83226; --red-soft:#fbe9e6; --amber:#4a6a1a; --amber-soft:#eef3df;
  --ok:#3f7a12; --ok-soft:#e8f2da; --blue:#2c6a57; --blue-soft:#e2efe9;
  --shadow:0 1px 2px rgba(31,59,51,.05),0 8px 24px rgba(31,59,51,.06);
  --r:14px; --hfont:"League Spartan","Hanken Grotesk",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101612; --card:#18211b; --ink:#e4ece5; --muted:#97a69b; --line:#28342c; --soft:#1f2a22;
    --brand:#9ccf6a; --brand-ink:#10190f; --leaf:#9ccf6a; --leaf-soft:#1f2c18; --banana:#9ccf6a; --banana-soft:#1f2c18;
    --red:#f08376; --red-soft:#381e1a; --amber:#c3dc8f; --amber-soft:#243020;
    --ok:#9ccf6a; --ok-soft:#1d2b17; --blue:#8fd0b8; --blue-soft:#18302a; --shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Hanken Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* header — cream with banana-leaf line art, like the title slide */
header{position:relative;overflow:hidden;background:linear-gradient(120deg,#f4f5e8 0%,#e9efd9 100%);color:var(--ink);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme: dark){ header{background:linear-gradient(120deg,#15201a 0%,#1a2a1f 100%)} }
header .leaves{position:absolute;inset:0;pointer-events:none;opacity:.55}
header .leaves path{fill:none;stroke:#8fa77e;stroke-width:1.2}
header .wrap{position:relative}
.hd{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:26px 0 18px;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.logo{width:46px;height:46px;border-radius:12px;overflow:hidden;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(31,75,58,.18)}
.logo img{width:100%;height:100%;display:block}
.eyebrow{font-family:var(--hfont);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.brand h1{margin:0;font-family:var(--hfont);font-size:30px;line-height:1;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.brand h1 em{font-style:normal;color:var(--leaf)}
.brand p{margin:4px 0 0;font-size:13px;color:var(--muted);max-width:620px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;white-space:nowrap}
.pill b{color:#c9e79a}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--muted);padding:10px 14px;border-radius:10px 10px 0 0;font-weight:700;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--bg);color:var(--ink);box-shadow:inset 0 3px 0 var(--leaf)}
nav .count{display:inline-block;margin-left:6px;font-size:11px;background:var(--leaf);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}

main{padding:24px 0 60px}
h2{font-family:var(--hfont);font-size:24px;line-height:1.1;margin:0 0 12px;font-weight:800;letter-spacing:-.025em;color:var(--ink)}
h3{font-family:var(--hfont);font-size:18px;margin:0 0 10px;font-weight:700;letter-spacing:-.015em}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.g3,.g2{grid-template-columns:1fr}}
.section{margin-top:28px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .k{font-family:var(--hfont);font-size:12px;color:var(--leaf);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:var(--hfont);font-size:32px;line-height:1.1;font-weight:800;color:var(--brand);letter-spacing:-.02em;margin-top:2px}
.stat.hot{background:var(--brand);border-color:var(--brand);color:#fff}.stat.hot .k,.stat.hot .v,.stat.hot .small{color:#fff}.stat.hot .k{color:#c9e79a}
.stat input[type=date]{margin-top:6px;width:100%;color:var(--ink);background:#fff;border-color:transparent}
@media (prefers-color-scheme: dark){.stat input[type=date]{background:var(--card)}}

/* member cards */
.member{cursor:pointer;transition:transform .15s,border-color .15s;border-top:4px solid var(--c)}
.member:hover{transform:translateY(-2px)}
.member .nm{font-family:var(--hfont);font-weight:800;font-size:19px;letter-spacing:-.02em}
.member .rl{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--c,var(--brand));border-radius:99px;transition:width .4s}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--soft);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:18px}
.kv span{font-size:11.5px;color:var(--muted)}
.kv .bad{background:var(--red-soft);color:var(--red)}
.kv .bad span{color:var(--red)}

/* chips & controls */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
input:not([type]),input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=password],input[type=tel],input[type=url],select,textarea{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.btn{border:0;background:var(--brand);color:var(--brand-ink);padding:9px 16px;border-radius:10px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:150px minmax(0,1fr) 150px 40px;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px}
.task.overdue{background:var(--red-soft)}
.task.soon{background:var(--amber-soft)}
.resume button{background:var(--card)!important;border-color:var(--line)!important;border-left:4px solid var(--leaf)!important}
.task.done{opacity:.6}
.task.done .t-title{text-decoration:line-through}
.t-title{font-weight:600}
.t-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;font-size:12.5px;color:var(--muted);align-items:center}
.t-meta .who{color:var(--c);font-weight:700}
.tag{background:var(--soft);border-radius:6px;padding:1px 8px;font-weight:600}
.p-High{color:var(--red);font-weight:700}
.due-pill{font-weight:700;border-radius:6px;padding:1px 8px;background:var(--soft)}
.overdue .due-pill{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.soon .due-pill{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.task .iconbtn{width:40px;height:40px}
.task-edit{grid-column:1/-1}
.status{font-weight:700;width:100%}
.s-done{background:var(--ok-soft);color:var(--ok)}
.s-in-progress{background:var(--blue-soft);color:var(--blue)}
.s-waiting{background:var(--amber-soft);color:var(--amber)}
@media (max-width:720px){
  .task{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:10px}
  .task .t-main{grid-column:1/-1;order:-1}
}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
form.add{display:grid;grid-template-columns:minmax(0,2fr) 130px 150px 150px 120px auto;gap:10px;align-items:end;margin-bottom:14px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fl input,.fl select{width:100%;text-transform:none;letter-spacing:0;font-weight:500;font-size:14px;color:var(--ink)}
@media (max-width:900px){form.add{grid-template-columns:1fr 1fr} form.add .wide{grid-column:1/-1}}

/* urgent list */
.ulist{display:flex;flex-direction:column}
.ui{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ui:last-child{border-bottom:0}
.ui .d{flex:none;width:68px;text-align:center;border-radius:10px;padding:5px 0;font-size:12px;font-weight:800}
.ui .d.overdue{background:var(--red-soft);color:var(--red)}
.ui .d.soon{background:var(--amber-soft);color:var(--amber)}
.ui .d.later{background:var(--soft);color:var(--muted)}
.ui .w{font-size:12px;color:var(--c);font-weight:700}

/* milestones */
.ms{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,140px) 48px;gap:12px;align-items:center;padding:8px 0}
.ms .bar{margin:0}
.ms b{text-align:right}

/* revisions */
.rgroup{margin-bottom:14px}
.rhead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.rnum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.rev{display:grid;grid-template-columns:minmax(0,1fr) 170px 120px 70px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.rev.C{background:var(--ok-soft)}
.rev.NA{opacity:.55}
.rev .warn{color:var(--red);font-weight:700}
.own{font-size:12px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.C{background:var(--ok);color:#fff}
.seg button.on.NC{background:var(--ink);color:var(--card)}
.seg button.on.NA{background:var(--muted);color:var(--card)}
.pgl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.pgl input{width:100%;min-width:0}
label.ck{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;cursor:pointer}


/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:13px}
th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 8px;font-weight:700;white-space:nowrap}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle}
td input[type=text],td input[type=number],td input[type=date],td select{width:100%;padding:6px 8px;border-radius:8px}
td.id{font-weight:800;white-space:nowrap}
td.fn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted);white-space:nowrap}
tr.filled td.id{color:var(--ok)}
.match{font-weight:700;white-space:nowrap}
.match.y{color:var(--ok)} .match.n{color:var(--red)}
.rule{background:var(--leaf-soft);border:1px solid color-mix(in srgb,var(--leaf) 35%,var(--line));border-radius:var(--r);padding:14px 16px;margin-bottom:16px;font-size:14px}
.rule code{background:var(--card);border-radius:6px;padding:1px 6px;font-weight:700}

/* supplies */
.sup{display:grid;grid-template-columns:28px minmax(0,1.2fr) minmax(0,2fr) 70px 110px 110px 130px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.sup:first-child{border-top:0}
.sup.bought .nm{text-decoration:line-through;color:var(--muted)}
.sup .nm{font-weight:700}
.sup input[type=number],.sup select{width:100%}
.sup .sub{text-align:right;font-weight:700}
.suphead{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;background:var(--soft);border-radius:var(--r) var(--r) 0 0}
@media (max-width:820px){.sup{grid-template-columns:28px 1fr 1fr}.sup .pp{grid-column:2/-1}.suphead{display:none}}

/* links */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lnk{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:border-color .15s,transform .15s}
.lnk:hover{border-color:var(--brand);transform:translateY(-1px)}
.lnk .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--soft);flex:none}
.lnk .ic svg{width:20px;height:20px;stroke:var(--brand)}
.lnk b{display:block;font-size:14px}
.lnk span{font-size:12px;color:var(--muted)}

/* sample cards */
.batch{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--brand);color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.batch .big{font-family:var(--hfont);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.batch .k{font-family:var(--hfont);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#c9e79a}
.batch .btn{background:#fff;color:var(--brand)}
.batch .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media (max-width:420px){.scards{grid-template-columns:1fr}}
.sc{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sc.sub{background:var(--ok-soft)}
.sc-top{display:flex;gap:10px;align-items:center}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;font-size:17px;background:var(--bg);color:var(--brand);border:1px dashed var(--leaf);border-radius:6px;padding:2px 8px;letter-spacing:.02em}
.sc-own{font-size:12px;font-weight:700;color:var(--c)}
.cam-btn{border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;background:var(--soft);color:var(--ink);white-space:nowrap}
.cam-btn.ok{background:var(--ok-soft);color:var(--ok)}
.cam-btn.part{background:var(--amber-soft);color:var(--amber)}
.cam-btn.none{background:var(--leaf);color:#fff}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-grid label,.sc-notes label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sc-grid input,.sc-grid select,.sc-notes input{width:100%;text-transform:none;letter-spacing:0;font-weight:500;font-size:14px;color:var(--ink)}
.sc-grid .wide{grid-column:1/-1}
.sc-foot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px}
.sc-sum{display:flex;flex-direction:column;gap:6px;cursor:pointer;border-radius:8px;margin:-4px;padding:4px}
.sc-sum:hover{background:var(--soft)}
.sc-sum .ttl{font-weight:700;font-size:15px}
.sc-sum .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted)}
.tagp{background:var(--soft);border-radius:999px;padding:2px 9px;font-weight:600;font-size:12px;color:var(--ink)}
.tagp.ok{background:var(--ok-soft);color:var(--ok)}
.tagp.warn{background:var(--amber-soft);color:var(--amber)}
.tagp.bad{background:var(--red-soft);color:var(--red)}
.alertcard{display:flex;gap:12px;align-items:center;background:var(--red-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:16px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.alertcard b{color:var(--red)}
.alertcard .go{margin-left:auto;font-weight:700;color:var(--red);white-space:nowrap}
.sheet-table tr.late td{color:var(--red)}
.morebtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px;color:var(--ink);cursor:pointer}
.morebtn:hover{background:var(--soft)}
.qchip{display:inline-flex;align-items:center;gap:6px;background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:4px 10px;font-weight:700;font-size:12.5px}

/* camera sheet */
.cam{position:fixed;inset:0;z-index:15;background:rgba(15,25,20,.55);display:flex;align-items:flex-end;justify-content:center}
.cam[hidden]{display:none}
.cam-sheet.wide{max-width:780px}
.cam.live{background:#000}
.cam.live .cam-sheet{max-width:none;width:100%;height:100%;max-height:none;border-radius:0;padding:0;background:#000;overflow:hidden}
.cam.live #camBody{height:100%}
.vf{position:relative;width:100%;height:100%;background:#000;color:#fff;user-select:none;-webkit-user-select:none}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}
.vf-flash.on{opacity:.75;transition:none}
.vf-top{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top)) 14px 30px;background:linear-gradient(rgba(0,0,0,.65),transparent);display:flex;gap:12px;align-items:flex-start}
.vf-top .tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;font-size:20px;background:#f4f2e8;color:#1f3b33;border-radius:6px;padding:2px 10px;flex:none}
.vf-top b{display:block;font-size:16px}.vf-top .small{opacity:.85}
.vf-x{margin-left:auto;flex:none;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}
.vf-bot{position:absolute;left:0;right:0;bottom:0;padding:24px 16px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;flex-direction:column;align-items:center;gap:14px}
.vf-tiles{display:flex;gap:10px}
.vf-tile{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:#fff;font-size:11px;font-weight:700;padding:0;cursor:pointer}
.vf-tile .im{width:56px;height:56px;border-radius:12px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:18px;font-weight:800;overflow:hidden;position:relative}
.vf-tile img{width:100%;height:100%;object-fit:cover}
.vf-tile.cur .im{border-color:#c9e79a;box-shadow:0 0 0 2px #c9e79a}
.vf-tile .w{position:absolute;right:3px;top:2px;font-size:13px;text-shadow:0 1px 2px #000}
.vf-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;max-width:420px}
.shutter{width:80px;height:80px;border-radius:50%;border:5px solid #fff;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.shutter i{display:block;width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .08s}
.shutter:active i{transform:scale(.86)}
.vf-done{justify-self:end;background:#c9e79a;color:#1f3b33;border:0;border-radius:999px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}
.vf-wait{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.strip3{display:flex;gap:8px;margin-top:10px}
.strip3 button{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0;overflow:hidden;position:relative;cursor:pointer;font-weight:800;color:var(--muted)}
.strip3 img{width:100%;height:100%;object-fit:cover}
.strip3 .w{position:absolute;right:3px;top:2px;font-size:13px}
.cam-sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.cam{align-items:center}.cam-sheet{border-radius:20px}}
.cam-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;font-weight:800;background:var(--bg);color:var(--brand);border:2px dashed var(--leaf);border-radius:8px;padding:2px 12px;display:inline-block}
.shot{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.shot .th{width:64px;height:64px;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden;font-size:22px;color:var(--muted)}
.shot .th img{width:100%;height:100%;object-fit:cover}
.shot b{display:block}
.shot .fn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted)}
.shot .st{font-size:12px;font-weight:700}
.shot.done .st{color:var(--ok)} .shot.up .st{color:var(--blue)} .shot.q .st{color:var(--amber)}
.shot.next{border-color:var(--leaf);box-shadow:0 0 0 2px color-mix(in srgb,var(--leaf) 30%,transparent)}
.bigcam{width:100%;margin-top:12px;padding:16px;font-size:16px;border-radius:14px}
.bigcam.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.cam-head{display:flex;gap:12px;align-items:flex-start}
.dots{display:flex;gap:6px;align-items:center;margin:14px 0 4px}
.dots i{width:30px;height:8px;border-radius:99px;background:var(--line)}
.dots i.opt{background:transparent;border:1.5px dashed var(--line);height:8px}
.dots i.on{background:var(--leaf);border-color:var(--leaf)}
.dots i.q{background:var(--amber);border-color:var(--amber)}
.dots span{font-size:12px;color:var(--muted);margin-left:6px}
.step{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--leaf);border-radius:16px;padding:14px;margin-top:12px}
.step-n{width:44px;height:44px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-family:var(--hfont);font-weight:800;font-size:22px;flex:none}
.step b{font-size:17px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.tile{position:relative;aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);display:grid;place-items:center;cursor:pointer;overflow:hidden;font-weight:800;color:var(--muted);padding:0}
.tile.opt{border-style:dashed}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .badge{position:absolute;right:3px;bottom:3px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 4px}
.tile.cur{border-color:var(--leaf);box-shadow:0 0 0 2px color-mix(in srgb,var(--leaf) 35%,transparent)}
.strip-cap{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;font-size:10.5px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.2}
.tape{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:44px;font-weight:800;letter-spacing:.04em;background:#f4f2e8;color:#1f3b33;border:2px dashed var(--leaf);border-radius:6px;padding:8px 18px;display:inline-block;transform:rotate(-1.5deg);box-shadow:0 2px 0 var(--line);margin:10px 0 6px}
.fsteps{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.fsteps li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.fsteps input[type=checkbox]{width:22px;height:22px;flex:none}
.fsteps .n{width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.qd{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fsteps b{white-space:nowrap}

/* new sample / supplies / task editing */
.newsample{font-size:16px;padding:14px 20px;border-radius:14px}
.viewbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--leaf);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.viewbar b{font-size:15px}
.viewbar .small{color:var(--muted)}
.resume{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.resume button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--amber-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600}
.resume button .lbl{font-size:15px}
.resume button .go{margin-left:auto;font-weight:800;color:var(--amber);white-space:nowrap}
.photo-pill{border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap;background:var(--soft)}
.photo-pill.ok{background:var(--ok-soft);color:var(--ok)}
.photo-pill.part{background:var(--amber-soft);color:var(--amber)}
.batch .newsample{background:#fff;color:var(--brand)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:15px;flex:none}
.iconbtn.on{border-color:var(--brand);background:var(--soft)}
.iconbtn:hover{border-color:var(--red)}
.iconbtn:disabled{opacity:.4;cursor:default}
.ck.big{font-size:14px;font-weight:700}
.ck.big input{width:20px;height:20px}
.addsup{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) 150px 70px 100px 130px auto auto;gap:10px;align-items:end;padding:14px;margin-bottom:14px}
@media (max-width:980px){.addsup{grid-template-columns:1fr 1fr}.addsup .wide{grid-column:1/-1}}
.rcpt{font-weight:700;text-decoration:none;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:6px 12px}
.task-edit{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,2fr) 1fr 1fr minmax(0,2fr) auto;gap:8px;align-items:end;border-top:1px dashed var(--line);padding-top:10px}
.task-edit label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.task-edit input,.task-edit select{width:100%;text-transform:none;letter-spacing:0;font-weight:500;font-size:14px;color:var(--ink)}
.task-edit .row{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.task-edit .row .btn{min-width:110px}
@media (max-width:720px){.task-edit{grid-template-columns:1fr 1fr}.task-edit .wide{grid-column:1/-1}}
.t-tools{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}

/* readiness, bulk bars, paper numbers, photo check */
.ready{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 14px}
.ready div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ready b{display:block;font-family:var(--hfont);font-size:24px;color:var(--brand)}
.ready span{font-size:12px;color:var(--muted)}
.bulk{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--brand);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.bulk .btn{background:#fff;color:var(--brand)}
.bulk .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.rev .pick{width:20px;height:20px}
.rev{grid-template-columns:24px minmax(0,1fr) auto}
.rev.solo{grid-template-columns:minmax(0,1fr) auto}
.rctl{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rctl .seg button{padding:8px 12px;font-size:13px}
.rmore{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rmore .pgl input{width:70px}
@media (max-width:720px){.rev,.rev.solo{grid-template-columns:24px minmax(0,1fr)}.rev.solo{grid-template-columns:minmax(0,1fr)}
  .rctl{grid-column:1/-1;align-items:stretch}.rev:not(.solo) .rctl{grid-column:2/-1}
  .rctl .seg{display:grid;grid-template-columns:1.4fr 1fr .8fr}.rctl .seg button{padding:10px 8px}}

.doneby{color:var(--ok);font-weight:700}
.resched{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.paper{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:12px;font-size:14px;line-height:1.55}
details.card summary{cursor:pointer;font-weight:700;list-style:none}
details.card summary::-webkit-details-marker{display:none}
.checkwarn{background:var(--amber-soft);color:var(--amber);border:2px solid var(--amber);border-radius:16px;padding:14px;margin-top:12px;display:flex;gap:12px;align-items:center}
.checkwarn img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none}

/* ---------- phone layout: slim header + bottom tab bar ---------- */
.bnav{display:none}
.addtoggle{display:none}
@media (max-width:720px){
  .hd{padding:10px 0;gap:10px;flex-wrap:nowrap}
  .brand{gap:10px}
  .logo{width:36px;height:36px;border-radius:10px}
  .brand .eyebrow,#thesis,#countPill{display:none}
  .brand h1{font-size:21px;white-space:nowrap}
  .me{padding:4px}
  .me .me-name{display:none}
  .me .av{width:32px;height:32px;font-size:14px}
  .hd-right{flex-wrap:nowrap}
  .install{padding:6px 10px;font-size:12px}
  header .leaves{display:none}
  #nav{display:none}
  main{padding:16px 0 calc(84px + env(safe-area-inset-bottom))}
  footer{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(80px + env(safe-area-inset-bottom))}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(31,59,51,.08)}
  .bnav button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;min-height:48px}
  .bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .bnav button.on{color:var(--brand)}
  .bnav button.on svg{stroke-width:2.4}
  .bnav button.on::before{content:"";position:absolute;top:-6px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--leaf)}
  .bnav .count{position:absolute;top:0;left:calc(50% + 6px);font-size:10px;background:var(--leaf);color:#fff;border-radius:999px;padding:0 5px;line-height:16px}
  .addtoggle{display:block;width:100%;margin-bottom:12px}
  .addwrap:not(.open) form{display:none}
  .sample-tip{font-size:13.5px}
}

.tap{cursor:pointer;transition:border-color .15s,transform .15s}
.tap:hover{border-color:var(--leaf)}
.tap:active{transform:scale(.99)}
.filters{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0;margin:0 0 10px!important}
@media (max-width:720px){.filters{flex-direction:column;align-items:stretch;gap:8px}.filters .sp{display:none}
  .filters .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.filters .chips::-webkit-scrollbar{display:none}
  .filters .chip{flex:none}}

/* toast + loading */
#toast{visibility:hidden;position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13.5px;transition:transform .25s;z-index:9;max-width:calc(100% - 32px)}
#toast.show{visibility:visible;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red);color:#fff}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-i{display:inline-block;width:.95em;height:.95em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-.15em;margin-right:6px;animation:spin .7s linear infinite;flex:none}
.is-busy{pointer-events:none;opacity:.85}
.btn[aria-busy=true],.linkbtn[aria-busy=true]{opacity:.92;cursor:progress}
.tile .badge .spin-i{margin:0;width:.8em;height:.8em}
@media (prefers-reduced-motion:reduce){.spin-i{animation-duration:2s}}
.demo{background:var(--brand);color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:6px 16px}
/* app chrome */
header{padding-top:env(safe-area-inset-top)}
.hd-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.install{border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}
.offline{background:#34453c;color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:6px 16px}
.login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:linear-gradient(120deg,#f4f5e8 0%,#e3ebd0 100%)}
@media (prefers-color-scheme: dark){.login{background:linear-gradient(120deg,#121a15,#1a2a1f)}}
.login[hidden]{display:none}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:12px}
.login-card h2{margin:4px 0 0;font-size:28px;line-height:1.1}
.login-card .sub{margin:-6px 0 4px;color:var(--muted);font-size:14px}
.login-card .btn{width:100%;display:inline-flex;align-items:center;justify-content:center;min-height:48px}
#authBody{display:flex;flex-direction:column;gap:14px}
.card-top{display:flex;align-items:center;justify-content:space-between;min-height:56px}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:0;border-radius:999px;padding:8px 14px 8px 10px;font-weight:700;font-size:13.5px;color:var(--ink);cursor:pointer;min-height:36px}
.backbtn:hover{background:var(--line)}
.backbtn[hidden]{display:none}
.acct-pill{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;overflow:hidden}
.acct-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-pill .av{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.auth-links{display:flex;justify-content:center;gap:18px;margin-top:-2px}
.auth-links .linkbtn{font-size:13.5px;padding:6px 2px;display:inline-flex;align-items:center}
.login-err:empty{display:none}
.pwwrap{position:relative;display:block}
.pwwrap input{width:100%;padding-right:48px!important}
.pwbtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:transparent;border:0;padding:0;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.pwbtn:hover{background:var(--soft);color:var(--ink)}
.pwbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fhint{font-size:12px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;min-height:1em}
.fhint.ok{color:var(--ok)}.fhint.warn{color:var(--red)}
.searchwrap{position:relative;display:inline-block}
.searchwrap input{padding-right:34px!important}
.searchwrap .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);cursor:pointer;font-size:13px}
input[type=search]::-webkit-search-cancel-button{display:none}
.login-err{background:var(--red-soft,#fdecea);border-radius:10px;padding:10px 12px}
.login-card label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.login-card label input{color:var(--ink);font-weight:500}
.login-card input{padding:12px 14px;font-size:16px}
.login-card .btn{padding:12px 16px;font-size:15px}
.who-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.who-btn{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:12px 14px;cursor:pointer;transition:transform .12s,border-color .12s}
.who-btn:hover,.who-btn:focus-visible{transform:translateY(-1px);border-color:var(--c)}
.who-btn .av{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--hfont);font-weight:800;font-size:18px;flex:none}
.who-btn b{display:block;font-size:15px}
.who-btn span{font-size:12.5px;color:var(--muted)}
.me{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.me .av{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.you{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--leaf);color:#fff;border-radius:999px;padding:1px 8px;vertical-align:middle}
.act{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.act:last-child{border-bottom:0}
.act .av{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.act time{display:block;font-size:12px;color:var(--muted)}
.login-err{color:var(--red);font-weight:600;font-size:13.5px;min-height:1em;margin:0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:20px 16px 40px}
/* --- field day, records, gallery --- */
.stats.s6{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat.hot2{background:var(--leaf-soft);border-color:color-mix(in srgb,var(--leaf) 40%,transparent)}
.stat input[type=date].lt{background:var(--card)}
.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 12px}
.hand div{background:var(--soft);border-radius:12px;padding:10px 12px}.hand b{display:block;font-size:22px;font-family:var(--hfont)}.hand span{font-size:12px;color:var(--muted)}
.goalrow{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:12px}
.goalrow .fl{width:140px}
.batch .gbar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin:8px 0 4px;width:min(260px,60vw)}
.batch .gbar i{display:block;height:100%;background:#c9e79a;border-radius:99px}
.checklist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.checklist li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer}
.checklist li.ok{background:var(--ok-soft);border-color:transparent}
.checklist .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800;color:#fff}
.checklist li.ok .bx{background:var(--ok);border-color:var(--ok)}
.checklist .auto{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}
details.card>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'▾';margin-left:auto;color:var(--muted)}
details.card[open]>summary::after{content:'▴'}
.sheet-table{width:100%;min-width:0;border-collapse:collapse;font-size:13.5px}
.sheet-table th{position:static}
.sheet-table td,.sheet-table th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.sheet-table input{width:20px;height:20px}
.sheet-table td:nth-child(2){white-space:nowrap}
@media screen and (max-width:600px){.sheet-table .hs{display:none}}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px;font-size:13px}
.sign div{border-top:1px solid var(--ink);padding-top:6px}
.mtable{width:100%;min-width:560px;border-collapse:collapse;font-size:13px}
.mtable th{position:static}
.mtable td,.mtable th{padding:8px;border-bottom:1px solid var(--line);text-align:right}
.mtable td:first-child,.mtable th:first-child,.mtable td:nth-child(2),.mtable th:nth-child(2){text-align:left}
.tscroll{overflow-x:auto;margin:10px -4px 0;padding:0 4px}
.metrics{display:flex;flex-wrap:wrap;gap:6px}
.drow{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.drow.done{background:var(--ok-soft);border-color:transparent}
.drow.done .ditem{text-decoration:line-through;color:var(--muted)}
.drow input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:1px}
.drow .ditem{font-weight:600}
.recform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end;padding:14px;margin-bottom:14px}
.recform .wide{grid-column:1/-1}
.recform textarea,.sc-grid textarea{width:100%;min-height:70px;resize:vertical;font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:500}
@media (max-width:720px){.recform{grid-template-columns:1fr 1fr}.stats.s6{grid-template-columns:1fr 1fr}.hand b{font-size:19px}}
.gallery{display:flex;flex-direction:column;gap:14px}
.gal-row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.gal-row .thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.gal-row .thumbs a{display:block;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--soft);position:relative}
.gal-row .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.gal-row .thumbs span{position:absolute;left:6px;bottom:6px;background:rgba(15,25,20,.7);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
@media print{
  body>*:not(#ov){display:none!important}
  #ov{position:static!important;background:none!important;display:block!important}
  #ov .cam-sheet{max-height:none;overflow:visible;border-radius:0;padding:0;max-width:none;background:#fff;color:#000}
  .noprint{display:none!important}
}

/* ================= Google (Material 3) look, in the app's own colours ================= */
:root{--tonal:#e3edd2;--on-tonal:#1f4b3a;--outline:#c9cfbd;--hover:rgba(31,75,58,.07)}
@media (prefers-color-scheme: dark){:root{--tonal:#26361f;--on-tonal:#cfe6ad;--outline:#3a4a3f;--hover:rgba(207,230,173,.08)}}
html{accent-color:var(--brand)}
h2{font-weight:700;letter-spacing:-.015em}
/* buttons: pill shaped; secondary = outlined */
.btn{border-radius:999px;font-weight:600;letter-spacing:.01em;min-height:40px;padding:10px 20px;transition:box-shadow .15s,background-color .15s}
.btn:hover:not(:disabled){box-shadow:0 1px 3px rgba(31,59,51,.28)}
.btn.ghost{background:transparent;border:1px solid var(--outline);color:var(--brand)}
.btn.ghost:hover:not(:disabled){background:var(--hover);box-shadow:none}
.bigcam,.login-card .btn,.addtoggle{border-radius:999px}
.batch .newsample{border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.bulk .btn{border-radius:999px}
/* filter chips: 8px corners, tonal + ✓ when selected */
.chip{border-radius:8px;border:1px solid var(--outline);background:transparent;padding:6px 12px;font-weight:500;color:var(--ink);min-height:32px;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--tonal);color:var(--on-tonal);border-color:transparent;font-weight:600}
.chip.on:not(:has(.dot))::before{content:'✓';font-weight:800;font-size:12px}
.chip .dot{margin-right:0}
/* cards and containers: outlined, softer corners, no heavy shadow */
.card,.stat,.sc,.lnk,.gal-row,.drow,.rev,.viewbar,.checklist li,.fsteps li{border-radius:16px}
.card{box-shadow:none}
.stat{border-color:var(--line)}
.cam-sheet{border-radius:28px 28px 0 0}
@media (min-width:700px){.cam-sheet{border-radius:28px}}
.cam.live .cam-sheet{border-radius:0}
/* segmented buttons: pill outline, tonal selection */
.seg{border-radius:999px;border-color:var(--outline)}
.seg button{font-weight:600;color:var(--ink);background:transparent}
.seg button+button{border-left-color:var(--outline)}
.seg button.on.C{background:var(--tonal);color:var(--on-tonal)}
.seg button.on.NC{background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink)}
.seg button.on.NA{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--ink)}
/* outlined text fields */
input:not([type]),input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=password],input[type=tel],input[type=url],select,textarea{border-radius:8px;border-color:var(--outline);min-height:40px}
.sheet-table input,.pick,input[type=checkbox]{min-height:0}
/* icon buttons: round, no box */
.iconbtn{border:0;background:transparent;border-radius:50%;width:40px;height:40px;transition:background-color .15s}
.iconbtn:hover{background:var(--hover);border-color:transparent}
.iconbtn.on{background:var(--tonal)}
.morebtn{border-color:var(--outline);color:var(--brand);font-weight:600}
.morebtn:hover{background:var(--hover)}
.tagp{border-radius:8px}
.cam-btn{font-weight:700}
/* snackbar */
#toast{border-radius:8px;padding:14px 18px;font-weight:500;min-width:min(288px,calc(100% - 32px));text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.25)}
/* desktop tabs: Google-style underline */
#nav button{border-radius:0;font-weight:600}
#nav button.on{background:none;color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
/* phone navigation bar: tonal pill behind the active icon */
@media (max-width:720px){
  .bnav{border-top:0;box-shadow:0 -1px 0 var(--line);padding-top:10px}
  .bnav button{gap:4px;font-weight:600;font-size:11px;min-height:56px}
  .bnav svg{width:56px;height:32px;padding:5px 17px;box-sizing:border-box;border-radius:16px;transition:background-color .2s}
  .bnav button,.bnav button.on{background:none;box-shadow:none;border-radius:0}
  .bnav button.on{color:var(--on-tonal)}
  .bnav button.on svg{background:var(--tonal);stroke-width:2.2}
  .bnav button.on::before{display:none}
  .bnav .count{top:-2px;left:calc(50% + 8px)}
  #toast{bottom:calc(88px + env(safe-area-inset-bottom))}      /* above the navigation bar, not hidden behind it */
}
#toast{z-index:30}

/* ================= responsive hardening: nothing wider than the screen, at any size ================= */
html,body{max-width:100%;overflow-x:hidden}
.row>*,.filters>*,.grid>*,.stats>*,.sc-grid>*,.hand>*,.recform>*,form.add>*,.addsup>*{min-width:0}
.filters,.filters .chips{min-width:0;max-width:100%}
.stats,.stats.s6{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.stats.s6{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat input[type=date],.sc-grid input,.sc-grid select,.fl input,.fl select{min-width:0;max-width:100%;width:100%}
input[type=date]{min-width:0}
.btn{max-width:100%;white-space:normal}
.lbl,.tag,.cam-id{max-width:100%;overflow:hidden;text-overflow:ellipsis}
img,svg,video,table{max-width:100%}
.sheet-table,.mtable{max-width:none}
@media (max-width:720px){
  .stats.s6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{padding:12px 14px}
  .stat .v{font-size:clamp(20px,6.5vw,30px)}
  .hand b{font-size:clamp(18px,6vw,22px)}
  .wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .row{flex-wrap:wrap}
  #q{width:100%!important}
  .searchwrap{flex:1 1 160px;min-width:0}
}
@media (max-width:360px){
  .stats.s6{gap:8px}
  .stat .k{font-size:10.5px}
  .chip{padding:5px 10px;font-size:12.5px}
  .bnav button{font-size:10px}
  .bnav svg{width:48px;padding:5px 13px}
  .brand h1{font-size:18px}
}
/* small phones: give squeezed controls their own row */
@media (max-width:400px){
  .task{grid-template-columns:minmax(0,1fr) 40px}
  .task select.status{grid-column:1/-1}
  .stats.s6 .stat.hot,.stats.s6 .stat.hot2{grid-column:1/-1;order:2}
  .stats.s6 .stat.hot,.stats.s6 .stat.hot2{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px}
  .stats.s6 .stat.hot .k,.stats.s6 .stat.hot2 .k{grid-column:1/-1}
  .stats.s6 .stat.hot input,.stats.s6 .stat.hot2 input{margin-top:0;width:auto;max-width:150px}
  .rmore{gap:8px}
}
/* tablets in portrait: use the space (two columns of cards) */
@media (min-width:560px) and (max-width:720px){
  .scards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats.s6{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ================= header: always one tidy row ================= */
.hd{flex-wrap:nowrap;gap:12px}
.brand{flex:1 1 auto;min-width:0}
.brand>div{min-width:0}
.brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-right{flex:0 0 auto;flex-wrap:nowrap;gap:8px}

<script>
/* =========================================================
   Data access: Apps Script when deployed, sample data when previewed
   ========================================================= */
const API_URL = String(window.TRACKER_API_URL || '').trim();
const DEMO = !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL);
// Phones and tablets can take photos; laptops/desktops only VIEW the sample collection.
const UA = navigator.userAgent;
const IS_PHONE = /Android|iPhone|iPad|iPod|Mobile|Silk|Kindle/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1) ||
  /[?&]phone\b/.test(location.search);   // ?phone forces phone mode (for testing)
document.documentElement.classList.add(IS_PHONE ? 'is-phone' : 'is-desktop');
const CAM_STORE = 'bt:cam';
const TOKEN_STORE = 'bt:token', ACCT_STORE = 'bt:acct', DATA_STORE = 'bt:data', INSTALL_SKIP = 'bt:installSkip';
const TEAM = [
  { tab: 'Fe Anne', name: 'Fe Anne Malasarte', role: 'Team Leader', color: '#6a1b9a', prefix: 'FA' },
  { tab: 'Rho', name: 'Rho Alphone Jornadal', role: 'Machine Learning Lead', color: '#1565c0', prefix: 'RJ' },
  { tab: 'Cha', name: 'Charisse Priego', role: 'Documentation Lead', color: '#c62828', prefix: 'CP' },
];
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
function cached() { try { return JSON.parse(store.get(DATA_STORE) || 'null'); } catch (e) { return null; } }

async function call(fn, ...args) {
  if (DEMO) {
    await new Promise(r => setTimeout(r, 150));
    let out;
    try { out = Demo[fn] ? Demo[fn](...args) : S.data; } catch (e) { return Promise.reject(e); }
    if (fn !== 'getData' && fn.indexOf('auth') !== 0 && S.data) (S.data.activity = S.data.activity || []).unshift({ when: 'Just now', who: S.user, what: fn.replace(/([A-Z])/g, ' $1').toLowerCase() });
    return out;
  }
  if (!navigator.onLine) { const err = new Error("You're offline."); err.network = true; throw err; }
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: store.get(TOKEN_STORE) || '', fn, args }),
    });
  } catch (e) {
    const err = new Error(navigator.onLine
      ? "The tracker server has a setup error (your internet is fine). In Apps Script: keep only ThesisTracker.gs and WebApp.gs, deploy a New version with access \"Anyone\"."
      : "You're offline.");
    err.network = true; err.server = navigator.onLine;     // writes still wait safely in the outbox
    throw err;
  }
  let j;
  try { j = await res.json(); }
  catch (e) { throw new Error('The tracker server has a setup error (your internet is fine). In Apps Script: keep only ThesisTracker.gs and WebApp.gs, deploy a New version with access "Anyone".'); }
  if (!j.ok) { const err = new Error(j.error || 'Request failed'); err.auth = !!j.auth; throw err; }
  if (fn === 'getData' && j.data) store.set(DATA_STORE, JSON.stringify({ at: Date.now(), d: j.data }));
  return j.data;
}

/* ---------- sample data for preview ---------- */
const DEMO_ACCOUNTS = { 'f.malasarte.543849@umindanao.edu.ph': 'Fe Anne', 'feannemlsrte@gmail.com': 'Fe Anne', 'r.jornadal.544960@umindanao.edu.ph': 'Rho',
  'lofty08.business@gmail.com': 'Rho', 'c.priego.545409@umindanao.edu.ph': 'Cha', 'changpriego@gmail.com': 'Cha' };

  const DOC = 'https://docs.google.com/document/d/1du8tYoex9vLWZCVAy1BsPHyzAsmjxJSJKiu2rBhTa40/edit';

    ps: { label: 'Public Dataset Sources', url: DOC + '?tab=t.s4c9q6mu8vpe' },
    vl: { label: 'Dataset Validation Letter', url: DOC + '?tab=t.37d5kfl379y3' },
    rl: { label: 'Dataset Request Letter', url: DOC + '?tab=t.6pxmo4idkk59' },
    cf: { label: 'Curated Dataset (Drive)', url: 'https://drive.google.com/drive/folders/1OxFuhfrEIChjzVFISjBL0J8yrMM2af-P' },
    td: { label: 'Thesis Working Doc', url: DOC },
  };
  let r = 4;

    ({ row: r++, id, task, category, priority, status, due: due === '' ? '' : iso(due), link: link ? L[link] : null, notes: notes || '', completed: status === 'Done' ? iso(-3) : '' });
  const fe = [
    T('F-01','Visit DA main office to request datasets / validation','DA RCPC','High','Done',-25,'','Redirected to DA RCPC Davao.'),
    T('F-02','Prepare DA Questions for the visit','DA RCPC','High','Done',-25,'da'),
    T('F-03','Draft the Dataset Validation Letter','Letters','Medium','Done','','vl'),
    T('F-04','Draft the Dataset Request Letter','Letters','Medium','Done','','rl'),
    T('F-05','Make the new docs file from scratch with the re-arranged structure','Paper','Medium','Done','','td'),
    T('F-06','Request datasets from DA (follow up through DA RCPC)','DA RCPC','Medium','Waiting','',''),
    T('F-07','Sort the Curated Banana Leaf Disease Dataset folder (with Cha)','Dataset','High','In Progress',2,'cf'),
    T('F-08','Contact DA RCPC Davao: confirm submission day, office hours, samples per class','DA RCPC','High','Not Started',1,''),
    T('F-09','Buy supplies: cotton, plastic bags, markers, masking tape','DA RCPC','High','Not Started',3,''),
    T('F-10','Lead field collection of fresh banana leaf samples (whole team)','DA RCPC','High','Not Started',8,''),
    T('F-11','Submit fresh, labeled samples to DA RCPC Davao','DA RCPC','High','Not Started',10,''),
    T('F-13','Collect + photograph your samples: tap ＋ New sample for each leaf (FA-001, FA-002 … automatic)','DA RCPC','High','Not Started',8,'','Copy the label the app shows onto masking tape.'),
    T('F-12','Lead panel revisions: Problem, Purpose, Objectives, Scope & Limitations','Panel Revision','High','Not Started',14,''),
  ];
  r = 4;
  const rho = [
    T('R-01','Retrain the baseline model from scratch and record results in Training Results','Model','High','In Progress',-1,'tr'),

function dueState(t) {
  if (t.status === 'Done' || !t.due) return '';
  const n = daysUntil(t.due);
  return n < 0 ? 'overdue' : n <= 3 ? 'soon' : '';
}
function dueText(t) {
  if (!t.due) return '';
  const n = daysUntil(t.due);
  if (t.status === 'Done') return '';
  if (n < 0) return Math.abs(n) + 'd overdue';
  if (n === 0) return 'Due today';
  if (n === 1) return 'Due tomorrow';
  return 'In ' + n + ' days';
}

function load(quiet) {
  return flushOutbox().then(() => {
    if (outbox().length) { const e = new Error('pending'); e.network = true; throw e; }
    return call('getData');
  }).then(d => {
    // a sample started on this phone that the server hasn't confirmed yet must not disappear (e.g. the app was closed mid-save)
    const fresh = new Set((d.samples || []).map(x => x.id));
    const unconfirmed = ((S.data && S.data.samples) || []).filter(x => !x.row && !fresh.has(x.id));
    unconfirmed.forEach(x => { d.samples.push(x); call('createSample', x.id).then(r => { const y = sampleById(x.id); if (y && r) { y.row = r.row; persist(); } }).catch(() => {}); });
    S.data = d; setOffline(false); persist();
    if (!quiet || !isTyping()) render();
    renderCam();
  }).catch(e => {
    if (e.auth) { lock(e.message); return; }
    const c = cached();
    if (c || S.data) {
      if (!S.data) S.data = c.d;
      setOffline(true, c ? c.at : Date.now());
      if (!isTyping()) render();
      return;
    }
    document.getElementById('app').innerHTML = '<div class="empty">Could not load the tracker: ' + esc(e && e.message || e) + '</div>';
  });
}

async function authSubmit(form) {
  const a = S.auth;
  if (a.busy) return;
  // read what was typed BEFORE redrawing the form
  const email = form.email ? form.email.value.trim().toLowerCase() : a.email;
  const pw = form.pw ? form.pw.value : '', code = form.code ? form.code.value.replace(/\D/g, '') : '';

  a.busy = true; renderAuth('');
  try {
    if (a.step === 'email') {
      if (!a.email) throw new Error('Enter your email.');
      const r = await call('authStart', a.email);

    } else if (a.step === 'password') {
      finishSignIn(await call('authLogin', a.email, pw));

  el.hidden = !n;
  el.title = n + ' change' + (n > 1 ? 's' : '') + ' waiting to sync';
  if (navigator.onLine && (flushing || Object.keys(S.uploading).length)) el.innerHTML = SPIN + '<span class="lng">Syncing </span>' + n;
  else el.innerHTML = '⏳ ' + n + '<span class="lng"> to sync</span>';
}
function flushOutbox() {
  if (flushing) return flushing;
  if (DEMO || !navigator.onLine || !outbox().length) return Promise.resolve();
  flushing = (async () => { updateSyncChip();
    let synced = 0;
    while (outbox().length) {
      const job = outbox()[0];
      try {
        const res = await call(job.fn, ...job.args);
        if (job.fn === 'addSupply' && res && job.tempId) {
          const i = S.data.supplies.findIndex(x => x.tempId === job.tempId);
          if (i > -1) S.data.supplies[i] = res;
        }
        if (job.fn === 'addRecord' && res && job.tempId) {
          const list = recs(job.kind), i = list.findIndex(x => x.tempId === job.tempId);
          if (i > -1) list[i] = res;
        }
        if (job.fn === 'addTask' && res && job.tempId) {
          const m = member(job.tab), i = m ? m.tasks.findIndex(t => t.tempId === job.tempId) : -1;
          if (i > -1) m.tasks[i] = res;
        }
        synced++;
      } catch (e) {
        if (e.network) break;                      // still no signal: keep it, try again later
        toast('One change could not sync: ' + e.message, 4000, true);  // server refused it: drop it
      }
      const a = outbox(); a.shift(); setOutbox(a);
    }
    if (synced) { persist(); toast('Synced ' + synced + ' change' + (synced > 1 ? 's' : '') + ' ✓', 1800); }
  })().finally(() => { flushing = null; updateSyncChip(); });
  return flushing;
}

function save(fn, args, apply, onQueued) {
  if (apply) apply();
  persist();
  if (!isTyping()) render();
  const queue = () => { const meta = onQueued ? onQueued() : null; queueWrite(fn, args, meta); persist(); if (!isTyping()) render(); return null; };
  if (!DEMO && (!navigator.onLine || outbox().length)) return Promise.resolve(queue());   // keep changes in order
  toast('Saving…');
  return call(fn, ...args).then(d => {
    persist();
    toast('Saved ✓', 1200);
    return d;
  }).catch(e => {
    if (e.auth) { lock(e.message); return; }
    if (e.network) return queue();
    toast('Could not save: ' + (e && e.message || e), 5000, true); load(true);
  });
}

  return '<div class="row" style="margin-bottom:6px"><h2 style="margin:0">Panel Revisions</h2><div class="sp"></div><b>' + c + ' / ' + applic.length + ' complied</b></div>' +

}

/* ---------- Samples ---------- */
const MIN_ANGLES = 3, MAX_ANGLES = 3;      // exactly 3 angles per leaf
const ANGLE_HINTS = [
  'Whole leaf, upper side, flat and in focus',
  'Flip the leaf and show the lower side',
  'Fill the frame with the spots or streaks',
  'Tilt about 45° so the texture shows (optional)',
  'Any other view that helps RCPC (optional)',
];
function angleNames() { return ((S.data && S.data.photoAngles) || ['Top surface', 'Underside', 'Lesion close-up']).slice(0, MAX_ANGLES); }
function ownerOf(id) { const p = String(id).split('-')[0]; const m = TEAM.find(t => t.prefix === p); return m ? m.tab : ''; }
function samplesOf(tab) { return S.data.samples.filter(s => ownerOf(s.id) === tab); }
function labelNum(id) { return +(String(id).split('-')[1] || 0); }
function fname(id, n) { return id + '_' + String(n).padStart(2, '0') + '.jpg'; }
function sampleById(id) { return S.data.samples.find(s => s.id === id); }
function queuedFor(id) { return Object.values(S.queued).filter(j => j.id === id).length; }
/** The next free label for a person: FA-001, FA-002 … handed out automatically, works offline too. */
function nextLabel(tab) {
  const m = TEAM.find(t => t.tab === tab);
  const used = new Set(samplesOf(tab).map(s => labelNum(s.id)));
  let n = 1; while (used.has(n)) n++;          // lowest free number: a deleted sample's label is used again
  return m.prefix + '-' + String(n).padStart(3, '0');
}
/** Saves where the sample was taken. GPS works without signal; the save waits in the outbox if offline. */
function captureGps(id) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const v = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6) + ' (±' + Math.round(pos.coords.accuracy) + ' m)';
    if (sampleById(id)) save('updateSample', [id, 'gps', v], () => { sampleById(id).gps = v; });
  }, () => {}, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
}
function gpsLink(g) { const m = String(g || '').match(/(-?\d+\.\d+),\s*(-?\d+\.\d+)/); return m ? 'https://www.google.com/maps?q=' + m[1] + ',' + m[2] : ''; }

/** Numbers + a ready-to-paste paragraph for section 2.1.2 (Local Test Set), from the sample log. */
/* DA RCPC rule: a leaf must be submitted the day after it was collected, or it is no longer fresh (invalid). */
function addDays(iso, n) { const d = toDate(iso); d.setDate(d.getDate() + n); return localDay(d); }
function freshness(x) {
  if (!x.date) return { st: 'nodate' };
  const due = addDays(x.date, 1);
  if (x.submitted) return { st: x.submitted <= due ? 'ok' : 'late', due };
  const n = daysUntil(due);
  return { st: n < 0 ? 'expired' : n === 0 ? 'today' : 'tomorrow', due, n };
}
const isValidLeaf = x => freshness(x).st === 'ok';
const dueLabel = due => { const n = daysUntil(due); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : fmt(due); };
function freshPill(x) {
  const f = freshness(x);
  if (f.st === 'late') return '<span class="tagp bad">Sent late · invalid</span>';
  if (f.st === 'expired') return '<span class="tagp bad">Not sent in time · invalid</span>';
  if (f.st === 'today') return '<span class="tagp bad">⏰ Send to RCPC today</span>';
  if (f.st === 'tomorrow') return '<span class="tagp warn">Send to RCPC by ' + esc(dueLabel(f.due)) + '</span>';
  return '';
}
function dueLeaves() {      // not yet sent and still fresh, soonest first
  return S.data.samples.filter(x => ['today', 'tomorrow'].indexOf(freshness(x).st) > -1).sort((a, b) => a.date < b.date ? -1 : 1);
}
function rcpcAlert(onSamples) {
  const due = dueLeaves();
  if (!due.length) return '';
  const today = due.filter(x => freshness(x).st === 'today').length;
  return '<div class="alertcard" ' + (onSamples ? 'data-action="openSheet"' : 'data-action="gotoView" data-v="samples"') + ' role="button" tabindex="0">🚨<div><b>' + due.length + ' lea' + (due.length === 1 ? 'f' : 'ves') + ' must reach DA RCPC ' +
    (today ? 'today' : 'by ' + esc(dueLabel(freshness(due[0]).due))) + '</b><div class="small">The day after collection, or they become invalid.</div></div><span class="go">' + (onSamples ? 'List →' : 'Send →') + '</span></div>';
}

function paperNumbers() {
  const d = S.data, cls = d.lists.classes.filter(c => !/unsure|unknown/i.test(c));
  const validated = d.samples.filter(x => cls.indexOf(x.validated) > -1 && isValidLeaf(x));   // late or expired leaves don't count
  const useVal = validated.length > 0;      // DA RCPC decides each leaf's disease; nothing is counted before that
  const set = validated;
  const key = x => x.validated;
  const per = cls.map(c => { const xs = set.filter(x => key(x) === c); return { c, n: xs.length, img: xs.reduce((a, x) => a + (x.angles || []).length, 0) }; });
  const imgs = per.reduce((a, p) => a + p.img, 0);
  const dates = Array.from(new Set(set.map(x => x.date).filter(Boolean))).sort();
  const sites = Array.from(new Set(set.map(x => (x.site || '').trim()).filter(Boolean)));
  const graded = validated.filter(x => x.disease);
  const agree = graded.filter(x => x.disease === x.validated).length;
  const mon = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dd = dates.map(s => { const [y, m, day] = s.split('-').map(Number); return { y, m, day }; });
  let when = '[collection dates]';
  if (dd.length) {
    const parts = []; dd.forEach((t, i) => { const prev = dd[i - 1]; parts.push((prev && prev.m === t.m && prev.y === t.y) ? String(t.day) : mon[t.m - 1] + ' ' + t.day); });
    when = (parts.length > 1 ? parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1] : parts[0]) + ', ' + dd[dd.length - 1].y;
  }
  const lc = c => /healthy/i.test(c) ? 'healthy' : c.replace(/Leaf Spot/, 'leaf spot');
  const list = per.map(p => p.n + ' ' + lc(p.c));
  const text = !set.length ? '' : 'The local test set consists of ' + set.length + ' banana leaf samples (' + imgs.toLocaleString('en-US') + ' images) collected from ' +
    (sites.length ? sites.join(', ') : '[farm / barangay]') + ' on ' + when + ': ' + list.slice(0, -1).join(', ') + ', and ' + list[list.length - 1] + ' samples. ' +
    'Each sample was photographed from three to five angles and submitted fresh to the DA Regional Crop Protection Center (RCPC) Davao' +
    ', which identified the disease class of each sample.';
  return { useVal, per, imgs, n: set.length, text, dates, sites };
}

function newSample() {
  if (!IS_PHONE || S.cam) return;          // no double labels from a double tap
  const id = nextLabel(S.user);
  const lastSite = (samplesOf(S.user).filter(s => s.site).sort((a, b) => labelNum(b.id) - labelNum(a.id))[0] || {}).site || '';
  S.data.samples.push({ row: 0, id, disease: '', date: localDay(), site: lastSite, by: S.user, photos: '',
    cotton: false, bagged: false, submitted: '', validated: '', notes: '', folder: '', angles: [] });
  S.sampleFilter = S.user;
  captureGps(id);
  save('createSample', [id]).then(r => { if (r && sampleById(id)) sampleById(id).row = r.row; });
  if (lastSite) save('updateSample', [id, 'site', lastSite]);
  openCam(id);
}

/** Quick quality check (paper: blurred, overexposed or dark images are excluded). Returns plain-language issues. */
function photoIssues(src) {
  try {

      ls += L; lq += L * L; n++;
    }
    const sharp = lq / n - (ls / n) * (ls / n);
    const out = [];
    if (mean < 45) out.push('is too dark');
    else if (sharp < 25) out.push('looks blurry');   // a dark photo always looks soft, so only mention the darkness
    if (mean > 215 || clip / (w * h) > 0.3) out.push('is too bright / washed out');

  } catch (e) { return []; }
}

/* offline-safe photo queue (IndexedDB) */
const PhotoQ = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('bt-photos', 2);
    r.onupgradeneeded = () => { if (r.result.objectStoreNames.contains('q')) r.result.deleteObjectStore('q'); r.result.createObjectStore('q'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('q', mode), req = fn(t.objectStore('q'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  }));
  return {
    put: (k, v) => run('readwrite', st => st.put(v, k)),      // errors bubble up: a photo must never vanish silently
    del: k => run('readwrite', st => st.delete(k)).catch(() => {}),
    all: () => run('readonly', st => st.getAll()).catch(() => []),
  };
})();

let uploadChain = Promise.resolve();
function jobKey(job) { return job.key || (job.id + '_' + job.angle); }
function queueUpload(job) {           // uploads go one at a time so the phone stays responsive
  const key = jobKey(job);
  if (S.uploading[key] || S.waiting[key]) return uploadChain;
  S.waiting[key] = true; delete S.queued[key]; renderCam(); updateSyncChip();
  uploadChain = uploadChain.then(() => sendPhoto(job));
  return uploadChain;
}
async function sendPhoto(job) {
  const key = jobKey(job);
  delete S.waiting[key];
  S.uploading[key] = true; delete S.queued[key]; renderCam(); updateSyncChip();
  if (job.kind === 'receipt') return sendReceipt(job, key);
  try {
    const patch = await call('uploadPhoto', job.id, job.angle, job.b64);
    const sm = S.data && sampleById(job.id);
    if (sm && patch) { Object.assign(sm, patch); persist(); }
    await PhotoQ.del(key);
    toast('Saved ' + fname(job.id, job.angle) + ' ✓', 1500);
  } catch (e) {
    if (e.auth) { delete S.uploading[key]; lock(e.message); return; }
    S.queued[key] = job;
    toast('📴 ' + fname(job.id, job.angle) + ' saved on this phone. It uploads by itself when there\'s signal.', 3000);
  }
  delete S.uploading[key];
  renderCam(); updateSyncChip();
  if (!S.cam && S.view === 'samples' && !isTyping()) render();
}
async function sendReceipt(job, key) {
  try {
    const patch = await call('uploadReceipt', job.row, job.b64);
    const x = S.data && S.data.supplies.find(s => s.row === job.row);
    if (x && patch) { Object.assign(x, patch); persist(); }
    await PhotoQ.del(key);
    toast('Receipt saved ✓', 1500);
  } catch (e) {
    if (e.auth) { delete S.uploading[key]; lock(e.message); return; }
    if (e.network) { S.queued[key] = job; toast('📴 Receipt saved on this phone. It uploads when there\'s signal.', 3000); }
    else { await PhotoQ.del(key); toast('Receipt not saved: ' + e.message, 4000, true); }
  }
  delete S.uploading[key];
  updateSyncChip();
  if (S.view === 'supplies' && !isTyping()) render();
}
async function flushPhotos() {
  if (!navigator.onLine || !S.user) return;
  const jobs = await PhotoQ.all();
  for (const j of jobs || []) queueUpload(j);
  return uploadChain;
}

async function acceptShot(job, thumb) {
  try {
    await PhotoQ.put(job.id + '_' + job.angle, job);  // kept on the phone until Drive confirms
  } catch (e) {
    if (!navigator.onLine) {                          // can't keep it and can't send it: say so loudly
      toast('⚠ Phone storage is full. ' + fname(job.id, job.angle) + ' was NOT saved. Free up space, then retake it.', 7000, true);
      delete S.thumbs[job.id + '_' + job.angle]; renderCam(); return;
    }
    toast('Phone storage is full. Uploading ' + fname(job.id, job.angle) + ' now, so keep the app open.', 4000, true);
  }
  S.thumbs[job.id + '_' + job.angle] = thumb;
  if (navigator.vibrate) navigator.vibrate(40);       // little buzz = photo kept
  queueUpload(job);
  saveCamState(false);
  renderCam();
}
