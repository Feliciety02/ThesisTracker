document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.change;
  if (k === 'smpWho') { S.sampleFilter = el.value; render(); return; }
  if (k === 'taskStatus') { S.status = el.value; render(); return; }
  if (!k) return;
  const row = +el.dataset.row, field = el.dataset.field;
  let val = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value;
  if (k === 'task') {
    const tab = el.dataset.tab;
    save('updateTask', [tab, row, field, val], () => {
      const t = member(tab).tasks.find(x => x.row === row);
      t[field] = val;
      if (field === 'status') { t.completed = val === 'Done' ? localDay() : ''; t.doneBy = val === 'Done' ? (t.doneBy || S.user) : ''; }
    });
  } else if (k === 'revsel') {
    if (el.checked) S.revSel[row] = true; else delete S.revSel[row];
    render();
  } else if (k === 'rev') {
    save('updateRevision', [row, field, val], () => { S.data.revisions.find(r => r.row === row)[field] = val; });
  } else if (k === 'sample') {
    const id = el.dataset.id;
    save('updateSample', [id, field, val], () => { sampleById(id)[field] = val; });
  } else if (k === 'supply') {
    save('updateSupply', [row, field, val], () => { S.data.supplies.find(s => s.row === row)[field] = val; });
  } else if (k === 'rcpc') {
    save('setRcpcDate', [val], () => { S.data.rcpcDate = val; });
  } else if (k === 'setting') {
    if (el.type === 'number' && val !== '') val = Math.max(0, Math.round(val));
    save('setSetting', [field, val], () => { S.data.settings = Object.assign({}, settings(), { [field]: val }); });
  } else if (k === 'rec') {
    const kind = el.dataset.kind;
    save('updateRecord', [kind, row, field, val], () => {
      const r = recs(kind).find(x => x.row === row);
      if (!r) return;
      r[field] = val;
      if (field === 'done') r.doneBy = val ? S.user : '';
    });
  } else if (k === 'revOwnerSel') {
    S.revOwner = val; render();
  } else if (k === 'sheetSel') {
    if (el.checked) S.ov.sel[el.dataset.id] = true; else delete S.ov.sel[el.dataset.id];
    renderOv();
  } else if (k === 'sheetDate') {
    S.ov.date = val; renderOv();
  }
});

document.addEventListener('toggle', e => {
  if (!e.target.matches) return;
  if (e.target.matches('details[data-action=paperToggle]')) S.paperOpen = e.target.open;
  if (e.target.matches('details[data-action=prefarmToggle]')) { S.prefarmOpen = e.target.open; if (e.target.open) store.del(PREFARM_CLOSED); else store.set(PREFARM_CLOSED, localDay()); }
}, true);
document.addEventListener('keydown', e => {

  if (e.key === 'Escape') {                       // Esc closes whatever is open (not the camera)

// Caps Lock warning on password boxes
['keydown', 'keyup'].forEach(t => document.addEventListener(t, e => {
  if (!e.target.matches || !e.target.matches('#authForm [name=pw]') || !e.getModifierState) return;
  const h = document.getElementById('pwHint'); if (!h) return;

  else if (h.textContent.indexOf('Caps') > -1) { const nw = e.target.dataset.newpw; h.textContent = nw ? pwLenHint(e.target.value) : ''; h.className = 'fhint' + (nw && e.target.value.length >= 8 ? ' ok' : ''); }

  if (t.matches && t.matches('#authForm [name=code]')) {          // pasted "123 456" or "123-456" → 123456, then jump to the password

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'authForm') { authSubmit(f); return; }
  if (f.id === 'addForm') {
    const t = { task: f.task.value.trim(), category: f.category.value, priority: f.priority.value, due: f.due.value };
    if (!t.task) return;
    const tab = f.tab.value;
    f.querySelector('button').disabled = true;
    f.task.blur();
    save('addTask', [tab, t], null, () => {
      const tempId = 'tmp' + Date.now();
      member(tab).tasks.push({ row: 0, id: 'new', tempId, task: t.task, category: t.category, priority: t.priority,
        status: 'Not Started', due: t.due || '', link: null, notes: '', completed: '' });
      return { tempId, tab };
    }).then(task => {
      S.addTaskOpen = false;
      if (!task) { render(); return; }
      member(tab).tasks.push(task); persist(); render();
      toast('Task added to ' + tab, 1600);
    });
  } else if (f.classList.contains('recform')) {
    const kind = f.getAttribute('data-kind'), x = {};      // not f.dataset: a field named "dataset" would shadow it
    new FormData(f).forEach((val, key) => { x[key] = typeof val === 'string' ? val.trim() : val; });
    if (kind === 'consults') { x.status = 'Open'; x.signed = false; }
    if (kind === 'defense') x.done = false;
    S.data.records = S.data.records || {}; S.data.records[kind] = recs(kind);
    save('addRecord', [kind, x], null, () => {
      const tempId = 'tmp' + Date.now();
      S.data.records[kind].push(Object.assign({ row: 0, tempId, by: S.user }, x));
      return { tempId, kind };
    }).then(res => {
      if (!res) { S.addRec = null; render(); return; }
      S.data.records[kind].push(res); S.addRec = null; persist(); render();
      toast('Added', 1200);
    });
  } else if (f.id === 'addSupply') {
    const x = { item: f.item.value.trim(), purpose: '', qty: f.qty.value === '' ? '' : +f.qty.value,
      cost: f.cost.value === '' ? '' : +f.cost.value, assigned: f.assigned.value, notes: '',
      category: f.category.value, date: f.date.value, bought: f.bought.checked, receipt: '' };
    if (!x.item) return;
    f.reset(); f.item.blur();
    save('addSupply', [x], null, () => {
      const tempId = 'tmp' + Date.now();
      S.data.supplies.push(Object.assign({ row: 0, tempId }, x));
      return { tempId };
    }).then(res => {
      S.addExpOpen = false;
      if (!res) { render(); return; }
      S.data.supplies.push(res); persist(); render();
      toast('Added ' + res.item, 1400);
    });
  }
});

/* auto-refresh so the team sees each other's updates */
const busy = () => Object.keys(S.uploading).length || Object.keys(S.waiting).length;
// Live updates: every 10 s ask the server for its tiny "last change" stamp; fetch everything only when it moved.
// Changes made by teammates in the app OR typed straight into the Google Sheet show up within seconds.
function checkLive() {
  if (DEMO || !S.data || !S.user || S.checking || !navigator.onLine || document.visibilityState !== 'visible' || busy()) return;
  S.checking = true;
  call('getVersion').then(v => {
    if (v && v !== S.data.version) return load(true);
    setOffline(false);
  }).catch(e => { if (/Unknown action/.test(e.message || '')) S.noLive = true; }).finally(() => { S.checking = false; });
}
setInterval(checkLive, 10000);
// fallback for an older server version that can't answer getVersion yet
setInterval(() => { if (S.noLive && S.data && navigator.onLine && document.visibilityState === 'visible' && !isTyping() && !busy()) load(true); }, 120000);
let lastFocusLoad = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && nativeUploadAvailable()) flushPhotos();
  if (S.data && document.visibilityState === 'visible' && !busy() && Date.now() - lastFocusLoad > 5000) { lastFocusLoad = Date.now(); if (S.noLive) { if (!isTyping()) load(true); } else checkLive(); }
});
window.addEventListener('online', () => { if (S.data) flushOutbox().then(flushPhotos).then(() => load(true)); });
window.addEventListener('offline', () => { if (S.data) setOffline(true, (cached() || {}).at); });

/* install as an app */

const isStandalone = nativeCameraAvailable() || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.data && S.view === 'overview') render(); });
window.addEventListener('appinstalled', () => {
  installEvt = null; store.set(INSTALL_SKIP, '1'); if (S.data) render();
  if (!document.getElementById('install').hidden) { document.getElementById('install').hidden = true; startApp(); }
  toast('Installed', 2500);
});
function doInstall() {
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.then(c => { if (c && c.outcome === 'accepted') { store.set(INSTALL_SKIP, '1'); if (!document.getElementById('install').hidden) { S.cameFromInstall = true; document.getElementById('install').hidden = true; startApp(); } } }).finally(() => { installEvt = null; }); }
  else if (isIOS) document.getElementById('iosHint').hidden = false;
  else toast('Open your browser menu, then tap Install app', 4000);
}
if (!nativeCameraAvailable() && 'serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* start */
PhotoQ.all().then(jobs => { (jobs || []).forEach(j => { S.queued[jobKey(j)] = j; }); updateSyncChip(); });
PhotoQ.galleryKeys().then(keys => {
  (keys || []).forEach(key => {
    const m = String(key).match(/^([A-Z]{2}-\d{3,}|rcpt_\d+)_(\d+)$/);
    if (m) {
      const angles = S.phonePending[m[1]] || (S.phonePending[m[1]] = []);
      if (!angles.includes(+m[2])) angles.push(+m[2]);
      if (m[1].indexOf('rcpt_') === 0) PhotoQ.galleryFor(m[1]).then(shots => {
        shots.forEach(s => { S.shots[s.id + '_' + s.angle] = s; });
        if (S.data && S.view === 'supplies') render();
      }).catch(() => {});
    }
  });
  if (S.data && S.view === 'samples') render();
}).catch(() => {});
setInterval(() => { if (navigator.onLine && (outbox().length || Object.keys(S.queued).length)) flushOutbox().then(flushPhotos); }, 45000);
setInterval(() => { if (nativeUploadAvailable() && S.user && document.visibilityState === 'visible') flushPhotos(); }, 5000);
// ask the browser to keep offline photos/changes even when storage is tight
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
updateSyncChip();
if (DEMO) document.getElementById('demo').hidden = false;
function startApp() {
  let acct = null; try { acct = JSON.parse(store.get(ACCT_STORE) || 'null'); } catch (e) {}
  const c = cached(); if (c) S.data = c.d;
  if (!store.get(TOKEN_STORE) || !acct || !TEAM.some(m => m.tab === acct.user)) { lock(); return; }
  signIn(acct.user);                 // stays signed in on this device, online or offline
  flushPhotos();
  load().then(() => { resumeCam(); consumeNativeRestored(); return flushPhotos(); });
}
if (!isStandalone && !store.get(INSTALL_SKIP)) {
  document.getElementById('install').hidden = false;      // first: offer the app
  if (isIOS) document.getElementById('iosHint').hidden = false;
} else startApp();
</script>
</body>
</html>
